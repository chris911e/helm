image:
  repository: ghcr.io/chris911e/ads-lerntool
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

persistence:
  size: 256Mi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 192Mi

service:
  type: NodePort
  port: 80
  nodePort: 30067
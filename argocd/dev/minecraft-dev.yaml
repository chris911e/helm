apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:chris911e/helm.git
    targetRevision: HEAD
    path: minecraft
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

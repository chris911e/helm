apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ads-lerntool-study
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:chris911e/helm.git
    targetRevision: HEAD
    path: ads-lerntool
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: study
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
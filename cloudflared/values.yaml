replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: cloudflare/cloudflared
  tag: ""
  pullPolicy: IfNotPresent

tunnel:
  secret: cloudflared-token
  tokenKey: token

metricsPort: 2000

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minecraft.fullname" . }}
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
spec:
  # A single replica with Recreate: two pods must never share the world volume
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "minecraft.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PORT
              value: {{ .Values.rcon.port | quote }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rcon.secret }}
                  key: {{ .Values.rcon.passwordKey }}
          ports:
            - name: minecraft
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          startupProbe:
            exec:
              command: ["mc-health"]
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- if .Values.backup.enabled }}
        - name: backup
          image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
          imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.backup.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: RCON_HOST
              value: localhost
            - name: RCON_PORT
              value: {{ .Values.rcon.port | quote }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rcon.secret }}
                  key: {{ .Values.rcon.passwordKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backup.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "minecraft.fullname" . }}-data
        {{- if .Values.backup.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "minecraft.fullname" . }}-backups
        {{- end }}

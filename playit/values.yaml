revisionHistoryLimit: 2

image:
  repository: ghcr.io/playit-cloud/playit-agent
  tag: ""
  pullPolicy: IfNotPresent

agent:
  secret: playit-secret
  secretKeyKey: secret-key

# Mirrors docker-compose `network_mode: host`, so tunnels can target the node's ports
hostNetwork: true

resources: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
